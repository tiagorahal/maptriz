spring.application.name=webgis-backend
server.port=8080

# Credenciais fora do codigo: use variaveis de ambiente em qualquer ambiente que nao seja o local.
# Os defaults abaixo servem so para o Postgres local do desafio.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/webgis}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Nao vazar stack trace no corpo das respostas de erro (o devtools ligava isso em dev).
server.error.include-stacktrace=never
server.error.include-message=always

# Origem permitida pelo CORS (o front Angular). Sobrescreva via app.cors.origin se mudar.
app.cors.origin=http://localhost:4200

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.br.com.webgis=DEBUG
